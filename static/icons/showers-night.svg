<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- crescent moon top-right -->
  <defs>
    <mask id="sn">
      <rect width="48" height="48" fill="white"/>
      <circle cx="40" cy="8" r="8" fill="black"/>
    </mask>
  </defs>
  <circle cx="34" cy="12" r="10" fill="#B8CBE0" mask="url(#sn)"/>
  <!-- cloud -->
  <circle cx="12" cy="26" r="8"  fill="#607D8B"/>
  <circle cx="22" cy="22" r="9"  fill="#607D8B"/>
  <circle cx="31" cy="26" r="7"  fill="#607D8B"/>
  <rect x="4" y="26" width="27" height="7" fill="#607D8B"/>
  <!-- rain -->
  <g stroke="#42A5F5" stroke-width="2.5" stroke-linecap="round">
    <line x1="11" y1="37" x2="9"  y2="44"/>
    <line x1="19" y1="37" x2="17" y2="44"/>
    <line x1="27" y1="37" x2="25" y2="44"/>
  </g>
</svg>
