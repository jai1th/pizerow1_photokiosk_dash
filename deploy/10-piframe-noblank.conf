# PiFrame — keep the kiosk display always on.
# Disables the X screensaver (BlankTime) and all three DPMS power phases
# (StandbyTime/SuspendTime/OffTime). "0" = never trigger. Installed to
# /etc/X11/xorg.conf.d/ so the X server applies it at startup — no xset,
# no x11-xserver-utils package required.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
